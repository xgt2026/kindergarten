{% extends "base.html" %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
  <h3 class="fw-bold text-secondary"><i class="bi bi-images me-2"></i>照片墙 / 成长记录</h3>
</div>

<div class="card mb-4">
  <div class="card-body">
    <form method="post" enctype="multipart/form-data" class="row g-3 align-items-end">
      <div class="col-md-3">
        <label class="form-label text-muted small mb-1">选择儿童</label>
        <select name="child_id" class="form-select" required>
          <option value="">-- 请选择 --</option>
          {% for c in children %}
            <option value="{{ c.id }}">{{ c.name }}（{{ c.class_name or '未分班' }}）</option>
          {% endfor %}
        </select>
      </div>
      <div class="col-md-4">
        <label class="form-label text-muted small mb-1">记录描述</label>
        <input name="description" class="form-control" placeholder="比如：今天在玩滑梯～">
      </div>
      <div class="col-md-3">
        <label class="form-label text-muted small mb-1">上传照片</label>
        <input type="file" name="image" class="form-control" accept="image/*" required>
      </div>
      <div class="col-md-2">
        <button type="submit" class="btn btn-primary w-100">上传照片</button>
      </div>
    </form>
  </div>
</div>

<div class="row g-4">
  {% for p in photos %}
    <div class="col-md-3">
      <div class="card h-100">
        <img src="{{ url_for('static', filename=p.image_path) }}" class="card-img-top" style="height: 180px; object-fit: cover;">
        <div class="card-body p-3">
          <h6 class="card-title fw-bold text-primary">{{ p.child_name }}</h6>
          <p class="card-text mb-1 text-secondary" style="font-size: 14px;">{{ p.description }}</p>
          <small class="text-muted"><i class="bi bi-clock me-1"></i>{{ p.created_at }}</small>
          <form method="post" action="{{ url_for('photos_delete', photo_id=p.id) }}" class="mt-3" onsubmit="return confirm('确定删除？')">
            <button type="submit" class="btn btn-sm btn-outline-danger w-100">删除</button>
          </form>
        </div>
      </div>
    </div>
  {% else %}
    <div class="col-12 text-center text-muted py-5">暂无照片记录</div>
  {% endfor %}
</div>
{% endblock %}
