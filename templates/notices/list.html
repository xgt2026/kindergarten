{% extends "base.html" %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
  <h3 class="fw-bold text-secondary"><i class="bi bi-megaphone me-2"></i>通知公告管理</h3>
</div>

<div class="card mb-4">
  <div class="card-header bg-white fw-bold">发布新通知</div>
  <div class="card-body">
    <form method="post">
      <div class="mb-3">
        <label class="form-label text-muted small">通知标题</label>
        <input name="title" class="form-control" required placeholder="请输入标题">
      </div>
      <div class="mb-3">
        <label class="form-label text-muted small">通知内容</label>
        <textarea name="content" class="form-control" rows="3" required placeholder="请输入通知正文..."></textarea>
      </div>
      <button type="submit" class="btn btn-primary"><i class="bi bi-send me-1"></i>发布通知</button>
    </form>
  </div>
</div>

<div class="card">
  <div class="table-responsive">
    <table class="table table-hover align-middle mb-0">
      <thead class="table-light">
        <tr><th>发布时间</th><th>标题</th><th>内容</th><th>发布人</th><th>操作</th></tr>
      </thead>
      <tbody>
      {% for n in notices %}
        <tr>
          <td class="text-muted small">{{ n.created_at }}</td>
          <td><strong>{{ n.title }}</strong></td>
          <td>{{ n.content }}</td>
          <td><span class="badge bg-secondary">{{ n.author }}</span></td>
          <td>
            <form method="post" action="{{ url_for('notices_delete', notice_id=n.id) }}" class="d-inline" onsubmit="return confirm('确定删除？')">
              <button type="submit" class="btn btn-sm btn-outline-danger">删除</button>
            </form>
          </td>
        </tr>
      {% else %}
        <tr><td colspan="5" class="text-center text-muted py-4">暂无通知</td></tr>
      {% endfor %}
      </tbody>
    </table>
  </div>
</div>
{% endblock %}
